services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omi_jaffna
      POSTGRES_USER: omi_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omi_admin -d omi_jaffna"]
      interval: 5s
      retries: 10
  api:
    build: ./api
    env_file: ./api/.env
    environment:
      DATABASE_URL: postgres://omi_admin:${POSTGRES_PASSWORD}@db:5432/omi_jaffna
      PORT: 4000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api/uploads:/app/uploads
  web:
    build: ./web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
volumes:
  postgres_data:
