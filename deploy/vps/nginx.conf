# omijaffna.com — HTTP → HTTPS + TLS reverse proxy
# Certs live on the host at /etc/letsencrypt (mounted read-only).

# Password-reset links carry a one-time token in the query string: keep it out of the access log.
map $request_uri $omi_log_uri {
  "~^(?<omi_reset_path>/(api/auth/)?reset-password)\?" "$omi_reset_path?token=[redacted]";
  default $request_uri;
}
log_format omi_main '$remote_addr - $remote_user [$time_local] "$request_method $omi_log_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name omijaffna.com www.omijaffna.com 179.197.250.19 _;
  server_tokens off;
  access_log /var/log/nginx/access.log omi_main;

  client_max_body_size 45m;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://omijaffna.com$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.omijaffna.com;
  server_tokens off;
  access_log /var/log/nginx/access.log omi_main;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  ssl_certificate     /etc/letsencrypt/live/omijaffna.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/omijaffna.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://omijaffna.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name omijaffna.com;
  server_tokens off;
  access_log /var/log/nginx/access.log omi_main;

  ssl_certificate     /etc/letsencrypt/live/omijaffna.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/omijaffna.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 45m;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  # Website + CMS pages (the API sets its own headers with helmet).
  location / {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    proxy_pass http://site:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
