# omijaffna.com — HTTP → HTTPS + TLS reverse proxy
# Certs live on the host at /etc/letsencrypt (mounted read-only).

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name omijaffna.com www.omijaffna.com 179.197.250.19 _;

  client_max_body_size 45m;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://omijaffna.com$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.omijaffna.com;

  ssl_certificate     /etc/letsencrypt/live/omijaffna.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/omijaffna.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://omijaffna.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name omijaffna.com;

  ssl_certificate     /etc/letsencrypt/live/omijaffna.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/omijaffna.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 45m;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://site:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
